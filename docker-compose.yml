services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/checkins
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: api-1
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis

  # compose --profile multi up  → also starts api2/api3
  api2:
    build: .
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/checkins
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: api-2
    ports:
      - "3001:3000"
    depends_on: [mongo, redis]
    profiles: [multi]

  api3:
    build: .
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/checkins
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: api-3
    ports:
      - "3002:3000"
    depends_on: [mongo, redis]
    profiles: [multi]

  worker:
    build: .
    command: ["node", "dist/src/worker/webhookWorker.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/checkins
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
